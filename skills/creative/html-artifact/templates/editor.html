<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Artifact</title>
<style>
  :root {
    --ivory:#FAF9F5; --white:#FFFFFF; --slate:#141413; --clay:#D97757; --olive:#788C5D;
    --oat:#E3DACC; --gray-300:#D1CFC5; --gray-500:#87867F; --gray-700:#3D3D3A;
    --border:1.5px solid var(--gray-300); --radius:10px;
    --serif:ui-serif,Georgia,serif; --sans:system-ui,-apple-system,sans-serif;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ivory); color:var(--gray-700); font-family:var(--sans);
         line-height:1.6; padding:48px 24px; }
  .page { max-width:720px; margin:0 auto; }
  .eyebrow { font-family:var(--mono); font-size:11px; letter-spacing:.08em;
             text-transform:uppercase; color:var(--gray-500); }
  h1 { font-family:var(--serif); font-weight:500; font-size:28px; margin:8px 0 24px; }
  .row { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--white);
         border:var(--border); border-radius:var(--radius); margin-bottom:8px; }
  .row label { flex:1; }
  .toolbar { display:flex; flex-wrap:wrap; gap:10px; margin-top:24px; }
  button { font-family:var(--mono); font-size:13px; padding:9px 16px; border-radius:var(--radius);
           cursor:pointer; border:var(--border); background:var(--white); color:var(--gray-700); }
  button:focus-visible, input:focus-visible { outline:3px solid var(--clay); outline-offset:3px; }
  .btn-primary { background:var(--slate); color:var(--ivory); border-color:var(--slate); }
  .btn-primary.copied { background:var(--olive); border-color:var(--olive); }
</style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">Interactive artifact</p>
    <h1>Choose options and export the result</h1>
    <div id="list"></div>
    <div class="toolbar">
      <button id="copyBtn" class="btn-primary" type="button">Copy as markdown</button>
      <button id="resetBtn" type="button">Reset</button>
    </div>
  </main>

<script>
(function () {
  var INITIAL = [
    { id: "option-a", label: "Option A", selected: true },
    { id: "option-b", label: "Option B", selected: false }
  ];
  var state = structuredClone(INITIAL);
  var list = document.getElementById("list");

  function render() {
    list.replaceChildren();
    state.forEach(function (item) {
      var row = document.createElement("div");
      var checkbox = document.createElement("input");
      var label = document.createElement("label");
      row.className = "row";
      checkbox.type = "checkbox";
      checkbox.id = item.id;
      checkbox.checked = item.selected;
      label.htmlFor = item.id;
      label.textContent = item.label;
      checkbox.addEventListener("change", function () { item.selected = checkbox.checked; });
      row.append(checkbox, label);
      list.appendChild(row);
    });
  }

  function serialize(current) {
    return ["# Selection", ""].concat(current.filter(function (item) {
      return item.selected;
    }).map(function (item) {
      return "- " + item.label;
    })).join("\n");
  }

  function writeClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (_) {}
    document.body.removeChild(ta);
    return Promise.resolve();
  }

  var copyBtn = document.getElementById("copyBtn");
  var timer = null;
  function showCopied() {
    copyBtn.textContent = "Copied ✓";
    copyBtn.classList.add("copied");
    clearTimeout(timer);
    timer = setTimeout(function () {
      copyBtn.textContent = "Copy as markdown";
      copyBtn.classList.remove("copied");
    }, 1200);
  }
  copyBtn.addEventListener("click", function () {
    writeClipboard(serialize(state)).then(showCopied, showCopied);
  });
  document.getElementById("resetBtn").addEventListener("click", function () {
    state = structuredClone(INITIAL);
    render();
  });
  render();
})();
</script>
</body>
</html>
