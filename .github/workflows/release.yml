name: Release desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.4.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            id: macos-arm64
            os: macos-15
            script: dist:mac
            arch: arm64
            native_build_dependencies: '@rolldown/binding-darwin-arm64@1.1.4 @tailwindcss/oxide-darwin-arm64@4.3.2 @esbuild/darwin-arm64@0.28.1 lightningcss-darwin-arm64@1.32.0 @rollup/rollup-darwin-arm64@4.62.2'
            artifact_paths: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest-mac.yml
              apps/desktop/release/*.blockmap
          - name: macOS Intel
            id: macos-x64
            os: macos-15-intel
            script: dist:mac
            arch: x64
            native_build_dependencies: '@rolldown/binding-darwin-x64@1.1.4 @tailwindcss/oxide-darwin-x64@4.3.2 @esbuild/darwin-x64@0.28.1 lightningcss-darwin-x64@1.32.0 @rollup/rollup-darwin-x64@4.62.2'
            artifact_paths: |
              apps/desktop/release/*.dmg
              apps/desktop/release/*.zip
              apps/desktop/release/latest-mac.yml
              apps/desktop/release/*.blockmap
          - name: Windows x64
            id: windows-x64
            os: windows-2022
            script: dist:win
            arch: x64
            native_build_dependencies: '@rolldown/binding-win32-x64-msvc@1.1.4 @tailwindcss/oxide-win32-x64-msvc@4.3.2 @esbuild/win32-x64@0.28.1 lightningcss-win32-x64-msvc@1.32.0 @rollup/rollup-win32-x64-msvc@4.62.2'
            artifact_paths: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.msi
              apps/desktop/release/latest.yml
              apps/desktop/release/*.blockmap
          - name: Linux x64
            id: linux-x64
            os: ubuntu-22.04
            script: dist:linux
            arch: x64
            native_build_dependencies: '@rolldown/binding-linux-x64-gnu@1.1.4 @tailwindcss/oxide-linux-x64-gnu@4.3.2 @esbuild/linux-x64@0.28.1 lightningcss-linux-x64-gnu@1.32.0 @rollup/rollup-linux-x64-gnu@4.62.2'
            artifact_paths: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/*.deb
              apps/desktop/release/*.rpm
              apps/desktop/release/latest-linux*.yml
              apps/desktop/release/*.blockmap
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.26'
          enable-cache: true

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates dpkg-dev fakeroot file libarchive-tools rpm xz-utils

      - name: Validate release version
        shell: bash
        run: |
          package_version="$(node -p "require('./apps/desktop/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$package_version"
          test "$root_version" = "$package_version"
          test -f "apps/desktop/release-notes/$package_version.md"
          node scripts/bump-version.mjs --check

      - name: Resolve checked-out release commit
        id: release-ref
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Node.js dependencies
        run: npm ci

      # npm/cli#4828 can omit optional native packages for platforms other
      # than the one that originally wrote package-lock.json. Resolve the
      # platform bindings in isolation, then copy only those packages into the
      # locked install so npm cannot re-resolve or prune the project tree.
      - name: Install platform build bindings
        shell: bash
        run: |
          native_root="$RUNNER_TEMP/fan-native-bindings"
          mkdir -p "$native_root"
          npm install \
            --prefix "$native_root" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --legacy-peer-deps \
            ${{ matrix.native_build_dependencies }}
          cp -R "$native_root/node_modules/." node_modules/

      - name: Build desktop packages
        env:
          GITHUB_REF_NAME: ${{ env.RELEASE_TAG }}
          GITHUB_SHA: ${{ steps.release-ref.outputs.commit }}
        run: npm --prefix apps/desktop run ${{ matrix.script }} -- --${{ matrix.arch }} --publish never

      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.id }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Assemble release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-upload

          while IFS= read -r -d '' asset; do
            cp "$asset" release-upload/
          done < <(
            find release-artifacts -type f \( \
              -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' -o \
              -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.blockmap' \
            \) -print0
          )

          cp release-artifacts/release-macos-arm64/latest-mac.yml release-upload/latest-mac.yml
          cp release-artifacts/release-windows-x64/latest.yml release-upload/latest.yml
          find release-artifacts/release-linux-x64 -maxdepth 1 -name 'latest-linux*.yml' -exec cp {} release-upload/ \;

          compgen -G 'release-upload/*.dmg' >/dev/null
          compgen -G 'release-upload/*.exe' >/dev/null
          compgen -G 'release-upload/*.AppImage' >/dev/null
          test -f release-upload/latest-mac.yml
          test -f release-upload/latest.yml
          compgen -G 'release-upload/latest-linux*.yml' >/dev/null

          (cd release-upload && sha256sum * > SHA256SUMS.txt)
          find release-upload -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes_file="apps/desktop/release-notes/$version.md"
          test -f "$notes_file"
          mapfile -d '' assets < <(find release-upload -maxdepth 1 -type f -print0)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists and will not be changed." >&2
            echo "Publish fixes under a new version instead of replacing immutable release assets or notes." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --verify-tag \
            --title "Fan $version" \
            --notes-file "$notes_file" \
            --latest \
            --repo "$GITHUB_REPOSITORY"

          echo "Published [$RELEASE_TAG](https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG)" >> "$GITHUB_STEP_SUMMARY"
