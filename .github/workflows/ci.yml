name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.26"
          python-version: "3.13"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked --extra dev

      - name: Lint Python
        run: uv run --locked ruff check .

      # The legacy suite still contains assertions for removed SaaS and
      # messaging code. Keep the required check focused on the public build's
      # local process-security boundary until that test debt is retired.
      - name: Smoke-test local API security
        run: uv run --locked python -m pytest -q tests/test_gateway_websocket_auth.py

  desktop:
    name: Desktop
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install Node.js dependencies
        run: npm ci

      - name: Type-check desktop
        run: npm --prefix apps/desktop run type-check

      - name: Lint desktop
        run: npm --prefix apps/desktop run lint
