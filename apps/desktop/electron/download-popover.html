<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --popover-active: rgba(15, 23, 42, 0.1);
        --popover-background: #ffffff;
        --popover-border: rgba(15, 23, 42, 0.12);
        --popover-foreground: #20242a;
        --popover-green: #15a352;
        --popover-hover: rgba(15, 23, 42, 0.065);
        --popover-primary: #2563eb;
        --popover-primary-foreground: #ffffff;
        --popover-red: #e0474c;
        --popover-secondary: #565d66;
        --popover-tertiary: #7c848e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        padding: 8px;
        color: var(--popover-foreground);
        font-family:
          Inter,
          "Noto Sans SC",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        font-size: 12px;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }

      button {
        appearance: none;
        border: 0;
        font: inherit;
      }

      .panel {
        display: flex;
        width: 100%;
        height: 100%;
        min-width: 0;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid var(--popover-border);
        border-radius: 12px;
        background: var(--popover-background);
      }

      .header {
        display: flex;
        height: 40px;
        flex: 0 0 40px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid var(--popover-border);
        padding: 0 8px 0 12px;
      }

      .title {
        display: flex;
        min-width: 0;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        font-weight: 650;
        line-height: 1;
      }

      .title-icon {
        width: 15px;
        height: 15px;
        flex: none;
        color: var(--popover-primary);
      }

      .list {
        min-height: 0;
        flex: 1;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
        scrollbar-width: thin;
      }

      .row {
        position: relative;
        display: flex;
        height: 58px;
        min-width: 0;
        align-items: center;
        gap: 10px;
        border-bottom: 1px solid var(--popover-border);
        padding: 8px 9px 8px 12px;
      }

      .row:last-child {
        border-bottom: 0;
      }

      .state {
        display: grid;
        width: 30px;
        height: 30px;
        flex: 0 0 30px;
        place-items: center;
        border-radius: 8px;
        background: var(--popover-hover);
        color: var(--popover-tertiary);
      }

      .state svg {
        width: 17px;
        height: 17px;
      }

      .state[data-state="completed"] {
        color: var(--popover-green);
      }

      .state[data-state="failed"],
      .state[data-state="interrupted"] {
        color: var(--popover-red);
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 1.75px solid color-mix(in srgb, var(--popover-primary) 24%, transparent);
        border-top-color: var(--popover-primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .details {
        min-width: 0;
        flex: 1;
      }

      .filename {
        overflow: hidden;
        color: var(--popover-foreground);
        font-size: 12px;
        font-weight: 560;
        line-height: 17px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .status {
        margin-top: 1px;
        overflow: hidden;
        color: var(--popover-tertiary);
        font-size: 10.5px;
        line-height: 15px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .progress {
        height: 2px;
        margin-top: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--popover-hover);
      }

      .progress-value {
        height: 100%;
        border-radius: inherit;
        background: var(--popover-primary);
      }

      .actions {
        display: flex;
        flex: none;
        align-items: center;
        gap: 2px;
      }

      .action {
        display: inline-flex;
        height: 26px;
        min-width: 26px;
        align-items: center;
        justify-content: center;
        border-radius: 7px;
        background: transparent;
        color: var(--popover-secondary);
        cursor: default;
        transition:
          background-color 100ms ease,
          color 100ms ease;
      }

      .action:hover {
        background: var(--popover-hover);
        color: var(--popover-foreground);
      }

      .action:active {
        background: var(--popover-active);
      }

      .action:focus-visible {
        outline: 2px solid color-mix(in srgb, var(--popover-primary) 35%, transparent);
        outline-offset: -1px;
      }

      .action:disabled {
        cursor: default;
        opacity: 0.46;
      }

      .action-text {
        min-width: auto;
        padding: 0 8px;
        font-size: 11px;
        font-weight: 540;
      }

      .action svg {
        width: 15px;
        height: 15px;
      }

      .error {
        position: absolute;
        right: 10px;
        bottom: 6px;
        left: 52px;
        overflow: hidden;
        color: var(--popover-red);
        font-size: 9.5px;
        line-height: 12px;
        pointer-events: none;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .action {
          transition: none;
        }

        .spinner {
          animation-duration: 1.5s;
        }
      }
    </style>
  </head>
  <body>
    <section class="panel" aria-label="最近下载">
      <header class="header">
        <div class="title">
          <svg
            aria-hidden="true"
            class="title-icon"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
          >
            <path d="M12 3v12" />
            <path d="m7 10 5 5 5-5" />
            <path d="M5 21h14" />
          </svg>
          <span id="title">最近下载</span>
        </div>
        <button class="action" id="dismiss" type="button" aria-label="关闭下载列表" title="关闭">
          <svg
            aria-hidden="true"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
          >
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </header>
      <div class="list" id="downloads"></div>
    </section>
  </body>
</html>
